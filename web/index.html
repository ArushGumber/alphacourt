<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfaf7" />
    <meta name="description" content="AlphaCourt: a gateway that holds and tries an AI agent's trading strategy before it gets capital. A prosecutor, a defence and a judge, and no finding without an exhibit." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>AlphaCourt</title>
    <script>
      // The site routes by hash (#/courtroom). A deep link without one (/courtroom, from a host that answers
      // unknown paths with this page) is turned into the hash route before anything loads.
      ;(function () {
        var l = window.location
        var m = l.pathname.match(/^(.*?\/)(courtroom|studio|docket|results|connect|how-it-works|about|figure)\/?$/)
        if (m && !l.hash) l.replace(m[1] + '#/' + m[2] + l.search)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
