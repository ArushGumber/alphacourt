<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Inter, Helvetica, Arial, sans-serif" id="architecture-svg" viewBox="0 0 1100 566" width="1100" role="group" aria-labelledby="arch-title arch-desc" xmlns="http://www.w3.org/2000/svg" height="566"><title id="arch-title">AlphaCourt architecture</title><desc id="arch-desc">A research agent reaches the Web and the simulated markets only through the gateway. The gateway records every backtest in a research log and holds any strategy that asks for capital. The log goes to the court, where a prosecutor, a defence and a judge argue using exhibits from the forensic lab. The lab can read the sealed period of the data room; the agent cannot. An exhibit rule strikes any finding without an exhibit. The bailiff enforces the ruling, writes the audit record and only then releases an order to the simulated broker.</desc><defs><marker id="ac-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 8.5 5 1 8.5z" fill="#4a4740"></path></marker><marker id="ac-arrow-hot" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 8.5 5 1 8.5z" fill="#c8501d"></path></marker></defs><g transform="translate(0 34)" font-family="'Inter Variable', Inter, system-ui, sans-serif"><g class="figure-node" style="outline: none;"><rect x="290" y="40" width="226" height="300" rx="10" fill="#ffffff" stroke="#c5bfb3" stroke-width="1.4"></rect><text x="304" y="63" font-size="14.5" font-weight="650" fill="#1f1e1b">Gateway (MCP)</text></g><g class="figure-node" style="outline: none;"><rect x="606" y="40" width="230" height="300" rx="10" fill="#ffffff" stroke="#c5bfb3" stroke-width="1.4"></rect><text x="620" y="63" font-size="14.5" font-weight="650" fill="#1f1e1b">The court</text></g><g class="figure-node" style="outline: none;"><rect x="200" y="400" width="336" height="122" rx="10" fill="#ffffff" stroke="#c5bfb3" stroke-width="1.4"></rect><text x="214" y="423" font-size="14.5" font-weight="650" fill="#1f1e1b">Data room</text></g><g class="figure-node" style="outline: none;"><rect x="934" y="150" width="154" height="190" rx="10" fill="#ffffff" stroke="#c5bfb3" stroke-width="1.4"></rect><text x="948" y="173" font-size="14.5" font-weight="650" fill="#1f1e1b">Bailiff</text></g><g aria-hidden="true"><path d="M190 101 L304 101" fill="none" stroke="#4a4740" stroke-width="1.5" marker-end="url(#ac-arrow)" stroke-linejoin="round"></path><text x="240" y="92" text-anchor="middle" font-size="13.5" fill="#4a4740" stroke="#ffffff" stroke-width="4" paint-order="stroke"><tspan x="240" dy="0">read_page</tspan></text></g><g aria-hidden="true"><path d="M190 232 L290 232" fill="none" stroke="#4a4740" stroke-width="1.5" marker-end="url(#ac-arrow)" stroke-linejoin="round"></path><text x="240" y="224" text-anchor="middle" font-size="13.5" fill="#4a4740" stroke="#ffffff" stroke-width="4" paint-order="stroke"><tspan x="240" dy="0">MCP tool calls</tspan></text></g><g aria-hidden="true"><path d="M290 270 L190 270" fill="none" stroke="#4a4740" stroke-width="1.5" marker-end="url(#ac-arrow)" stroke-linejoin="round"></path><text x="240" y="286" text-anchor="middle" font-size="13.5" fill="#4a4740" stroke="#ffffff" stroke-width="4" paint-order="stroke"><tspan x="240" dy="0">results,</tspan><tspan x="240" dy="16">case id</tspan></text></g><g aria-hidden="true"><path d="M502 189 L606 189" fill="none" stroke="#4a4740" stroke-width="1.5" marker-end="url(#ac-arrow)" stroke-linejoin="round"></path><text x="561" y="160" text-anchor="middle" font-size="13.5" fill="#4a4740" stroke="#ffffff" stroke-width="4" paint-order="stroke"><tspan x="561" dy="0">case file +</tspan><tspan x="561" dy="16">research log</tspan></text></g><g aria-hidden="true"><path d="M822 295 L839 295 M931 295 L946 295" fill="none" stroke="#4a4740" stroke-width="1.5" marker-end="url(#ac-arrow)" stroke-linejoin="round"></path><text x="885" y="263" text-anchor="middle" font-size="13.5" fill="#4a4740" stroke="#ffffff" stroke-width="4" paint-order="stroke"><tspan x="885" dy="0">ruling</tspan></text></g><g aria-hidden="true"><path d="M1011 150 L1011 -6 L403 -6 L403 38" fill="none" stroke="#4a4740" stroke-width="1.5" marker-end="url(#ac-arrow)" stroke-linejoin="round"></path><text x="707" y="-13" text-anchor="middle" font-size="13.5" fill="#4a4740" stroke="#ffffff" stroke-width="4" paint-order="stroke"><tspan x="707" dy="0">the ruling releases or keeps the hold</tspan></text></g><g aria-hidden="true"><path d="M1011 340 L1011 398" fill="none" stroke="#4a4740" stroke-width="1.5" marker-end="url(#ac-arrow)" stroke-linejoin="round"></path><text x="1003" y="362" text-anchor="end" font-size="13.5" fill="#4a4740" stroke="#ffffff" stroke-width="4" paint-order="stroke"><tspan x="1003" dy="0">orders, only after</tspan><tspan x="1003" dy="16">the ruling</tspan></text></g><g aria-hidden="true"><path d="M660 340 L660 398" fill="none" stroke="#4a4740" stroke-width="1.5" marker-end="url(#ac-arrow)" stroke-linejoin="round"></path><text x="668" y="374" text-anchor="start" font-size="13.5" fill="#4a4740" stroke="#ffffff" stroke-width="4" paint-order="stroke"><tspan x="668" dy="0">tool calls</tspan></text></g><g aria-hidden="true"><path d="M780 398 L780 340" fill="none" stroke="#4a4740" stroke-width="1.5" marker-end="url(#ac-arrow)" stroke-linejoin="round"></path><text x="788" y="374" text-anchor="start" font-size="13.5" fill="#4a4740" stroke="#ffffff" stroke-width="4" paint-order="stroke"><tspan x="788" dy="0">exhibits</tspan></text></g><g aria-hidden="true"><path d="M330 340 L330 428" fill="none" stroke="#4a4740" stroke-width="1.5" marker-end="url(#ac-arrow)" stroke-linejoin="round"></path><text x="338" y="372" text-anchor="start" font-size="13.5" fill="#4a4740" stroke="#ffffff" stroke-width="4" paint-order="stroke"><tspan x="338" dy="0">research bars only</tspan></text></g><g aria-hidden="true"><path d="M610 468 L526 468" fill="none" stroke="#4a4740" stroke-width="1.5" marker-end="url(#ac-arrow)" stroke-linejoin="round"></path><text x="568" y="456" text-anchor="middle" font-size="13.5" fill="#4a4740" stroke="#ffffff" stroke-width="4" paint-order="stroke"><tspan x="568" dy="0">sealed bars</tspan></text></g><g class="figure-node" style="outline: none;"><rect x="16" y="40" width="174" height="92" rx="7" fill="#f3f0ea" stroke="none" stroke-width="1.4"></rect><text x="27" y="61" font-size="14.5" font-weight="650" fill="#1f1e1b">The Web</text><text font-size="13" fill="#4a4740"><tspan x="27" y="80">papers, forums,</tspan><tspan x="27" y="96">code, data feeds</tspan></text></g><g class="figure-node" style="outline: none;"><rect x="16" y="190" width="174" height="112" rx="7" fill="#f3f0ea" stroke="none" stroke-width="1.4"></rect><text x="27" y="211" font-size="14.5" font-weight="650" fill="#1f1e1b">Research agent</text><text font-size="13" fill="#4a4740"><tspan x="27" y="230">Claude Code, Codex,</tspan><tspan x="27" y="246">Gemini CLI or an</tspan><tspan x="27" y="262">open model</tspan></text></g><g class="figure-node" style="outline: none;"><rect x="304" y="76" width="198" height="62" rx="7" fill="#f3f0ea" stroke="none" stroke-width="1.4"></rect><text x="315" y="97" font-size="14.5" font-weight="650" fill="#1f1e1b">Tool proxy</text><text font-size="13" fill="#4a4740"><tspan x="315" y="116">research tools pass through</tspan></text></g><g class="figure-node" style="outline: none;"><rect x="304" y="158" width="198" height="62" rx="7" fill="#f3f0ea" stroke="none" stroke-width="1.4"></rect><text x="315" y="179" font-size="14.5" font-weight="650" fill="#1f1e1b">Research log</text><text font-size="13" fill="#4a4740"><tspan x="315" y="198">every backtest recorded</tspan></text></g><g class="figure-node" style="outline: none;"><rect x="304" y="240" width="198" height="62" rx="7" fill="#f3f0ea" stroke="none" stroke-width="1.4"></rect><text x="315" y="261" font-size="14.5" font-weight="650" fill="#1f1e1b">Hold</text><text font-size="13" fill="#4a4740"><tspan x="315" y="280">submit_strategy is held</tspan></text></g><g class="figure-node" style="outline: none;"><rect x="620" y="76" width="202" height="62" rx="7" fill="#f3f0ea" stroke="none" stroke-width="1.4"></rect><text x="631" y="97" font-size="14.5" font-weight="650" fill="#1f1e1b">Prosecutor</text><text font-size="13" fill="#4a4740"><tspan x="631" y="116">files charges, cites exhibits</tspan></text></g><g class="figure-node" style="outline: none;"><rect x="620" y="158" width="202" height="62" rx="7" fill="#f3f0ea" stroke="none" stroke-width="1.4"></rect><text x="631" y="179" font-size="14.5" font-weight="650" fill="#1f1e1b">Defence</text><text font-size="13" fill="#4a4740"><tspan x="631" y="198">answers, may concede</tspan></text></g><g class="figure-node" style="outline: none;"><rect x="620" y="240" width="202" height="62" rx="7" fill="#f3f0ea" stroke="none" stroke-width="1.4"></rect><text x="631" y="261" font-size="14.5" font-weight="650" fill="#1f1e1b">Judge</text><text font-size="13" fill="#4a4740"><tspan x="631" y="280">deploy, paper only or reject</tspan></text></g><g class="figure-node" style="outline: none;"><rect x="610" y="400" width="226" height="110" rx="7" fill="#f3f0ea" stroke="none" stroke-width="1.4"></rect><text x="621" y="421" font-size="14.5" font-weight="650" fill="#1f1e1b">Forensic lab</text><text font-size="13" fill="#4a4740"><tspan x="621" y="440">lag, point-in-time, costs,</tspan><tspan x="621" y="456">survivorship, sealed holdout,</tspan><tspan x="621" y="472">regime, trial count, placebo,</tspan><tspan x="621" y="488">stability, concentration, notes</tspan></text></g><g class="figure-node" style="outline: none;"><rect x="212" y="430" width="152" height="76" rx="7" fill="#f3f0ea" stroke="none" stroke-width="1.4"></rect><text x="223" y="451" font-size="14.5" font-weight="650" fill="#1f1e1b">Research period</text><text font-size="13" fill="#4a4740"><tspan x="223" y="470">the agent can use</tspan><tspan x="223" y="486">these bars</tspan></text></g><g class="figure-node" style="outline: none;"><rect x="380" y="430" width="144" height="80" rx="7" fill="#fbefe8" stroke="#c8501d" stroke-width="1.6" stroke-dasharray="5 3"></rect><text x="391" y="451" font-size="14.5" font-weight="650" fill="#1f1e1b">Sealed period</text><text font-size="13" fill="#4a4740"><tspan x="391" y="470">last quarter of bars,</tspan><tspan x="391" y="486">never shown to</tspan><tspan x="391" y="502">the agent</tspan></text><g transform="translate(500 438)" aria-hidden="true" fill="none" stroke="#a8411a" stroke-width="1.6" stroke-linecap="round"><rect x="1" y="7" width="11" height="8" rx="1.5" fill="#a8411a" stroke="none"></rect><path d="M3.5 7V5a3 3 0 0 1 6 0v2"></path></g></g><g class="figure-node" style="outline: none;"><rect x="946" y="188" width="130" height="62" rx="7" fill="#f3f0ea" stroke="none" stroke-width="1.4"></rect><text x="957" y="209" font-size="14.5" font-weight="650" fill="#1f1e1b">Audit record</text><text font-size="13" fill="#4a4740"><tspan x="957" y="228">one JSON file</tspan><tspan x="957" y="244">per case</tspan></text></g><g class="figure-node" style="outline: none;"><rect x="946" y="264" width="130" height="62" rx="7" fill="#f3f0ea" stroke="none" stroke-width="1.4"></rect><text x="957" y="285" font-size="14.5" font-weight="650" fill="#1f1e1b">Enforce</text><text font-size="13" fill="#4a4740"><tspan x="957" y="304">the ruling gates</tspan><tspan x="957" y="320">the order</tspan></text></g><g class="figure-node" style="outline: none;"><rect x="934" y="400" width="154" height="110" rx="7" fill="#f3f0ea" stroke="none" stroke-width="1.4"></rect><text x="945" y="421" font-size="14.5" font-weight="650" fill="#1f1e1b">Simulated broker</text><text font-size="13" fill="#4a4740"><tspan x="945" y="440">receives an order</tspan><tspan x="945" y="456">only after a ruling</tspan><tspan x="945" y="472">of deploy or paper</tspan></text></g><g class="figure-node" style="outline: none;"><rect x="839" y="274" width="92" height="42" rx="8" fill="#fbefe8" stroke="#c8501d" stroke-width="1.6"></rect><text x="885" y="292" text-anchor="middle" font-size="14" font-weight="650" fill="#a8411a">Exhibit</text><text x="885" y="308" text-anchor="middle" font-size="14" font-weight="650" fill="#a8411a">rule</text></g><g aria-hidden="true"><circle cx="561" cy="210" r="11" fill="#fff" stroke="#c8501d" stroke-width="1.6"></circle><text x="561" y="215" text-anchor="middle" font-family="'Inter Variable', Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#a8411a">1</text></g><g aria-hidden="true"><circle cx="524" cy="430" r="11" fill="#fff" stroke="#c8501d" stroke-width="1.6"></circle><text x="524" y="435" text-anchor="middle" font-family="'Inter Variable', Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#a8411a">2</text></g><g aria-hidden="true"><circle cx="931" cy="274" r="11" fill="#fff" stroke="#c8501d" stroke-width="1.6"></circle><text x="931" y="279" text-anchor="middle" font-family="'Inter Variable', Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#a8411a">3</text></g></g></svg>
